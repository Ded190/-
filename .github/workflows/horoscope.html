<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Гороскоп дня ✦</title>
<style>
:root{--bg:#05081c;--panel:rgba(16,26,63,.72);--line:rgba(130,170,255,.18);--accent:#7fb2ff;--text:#e2eaff;--dim:#8ea3d8}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{font-family:system-ui,'Segoe UI',Roboto,sans-serif;color:var(--text);background:radial-gradient(ellipse at 50% -25%,#1b2a66 0%,#0c1337 45%,#05081c 100%) fixed;overflow-x:hidden}
#sky{position:fixed;inset:0;z-index:0}
.wrap{position:relative;z-index:1;max-width:780px;margin:0 auto;padding:22px 14px 70px}
h1{text-align:center;font-size:clamp(26px,6vw,40px);font-weight:800;letter-spacing:.5px;
  background:linear-gradient(180deg,#e6efff,#7aa5ff);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 24px rgba(90,140,255,.35))}
.sub{text-align:center;color:var(--dim);font-size:13px;margin:6px 0 22px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;backdrop-filter:blur(8px);
  box-shadow:0 18px 50px rgba(0,0,0,.45),inset 0 1px 0 rgba(160,190,255,.08)}
.scene{perspective:1000px}
.tilt{transition:transform .18s ease, box-shadow .18s;transform-style:preserve-3d;will-change:transform}
.tilt:hover{box-shadow:0 26px 70px rgba(40,80,200,.35)}
/* знак рождения */
.bday{padding:20px;margin-bottom:20px}
.bday h2,.h2{font-size:15px;color:var(--accent);text-transform:uppercase;letter-spacing:1.5px;margin-bottom:12px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
input[type=date]{background:#0b1234;border:1px solid var(--line);border-radius:12px;color:var(--text);padding:11px 14px;font-size:15px;outline:none}
input[type=date]:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(127,178,255,.15)}
button{cursor:pointer;border:none;border-radius:12px;font-size:14px;font-weight:600;transition:transform .15s,filter .15s,background .2s}
button:active{transform:scale(.96)}
.btn{background:linear-gradient(135deg,#3d6bff,#7fb2ff);color:#fff;padding:11px 20px;box-shadow:0 8px 22px rgba(61,107,255,.35)}
.btn:hover{filter:brightness(1.12)}
.ghost{background:rgba(127,178,255,.12);color:var(--accent);padding:9px 14px;border:1px solid var(--line)}
.ghost:hover{background:rgba(127,178,255,.22)}
.signname{font-size:17px;color:#fff}
/* сетка знаков */
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:4px}
@media(max-width:560px){.grid{grid-template-columns:repeat(3,1fr)}}
.sign{position:relative;text-align:center;padding:14px 4px 10px;border-radius:14px;border:1px solid var(--line);
  background:linear-gradient(160deg,rgba(50,80,190,.25),rgba(10,16,45,.6));transform-style:preserve-3d;transition:transform .18s,border-color .2s,background .2s}
.sign .sym{font-size:30px;display:block;transform:translateZ(22px);transition:transform .18s}
.sign .nm{font-size:11.5px;color:var(--dim);margin-top:6px;display:block;transform:translateZ(12px)}
.sign:hover{border-color:var(--accent)}
.sign:hover .sym{transform:translateZ(30px) scale(1.15)}
.sign.on{border-color:#9ec1ff;background:linear-gradient(160deg,rgba(80,120,255,.45),rgba(20,35,90,.75));box-shadow:0 0 24px rgba(90,140,255,.35)}
.sign.on .nm{color:#fff}
/* карточка гороскопа */
.hcard{padding:22px;margin-bottom:20px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:14px 0 16px}
.tab{padding:8px 14px;border-radius:10px;background:rgba(127,178,255,.08);color:var(--dim);border:1px solid transparent}
.tab:hover{color:var(--text)}
.tab.on{background:rgba(90,140,255,.22);color:#fff;border-color:rgba(150,190,255,.4)}
.htext{font-size:16.5px;line-height:1.65;min-height:110px;white-space:pre-wrap}
.meta{color:var(--dim);font-size:12.5px;margin-top:12px}
.src{display:inline-block;padding:3px 10px;border-radius:99px;border:1px solid var(--line);margin-right:8px}
.src.live{color:#8ef0b8;border-color:rgba(140,240,180,.3)}
.src.gen{color:var(--accent)}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px;align-items:center}
.like{background:rgba(255,90,140,.14);color:#ff9db8;border:1px solid rgba(255,120,160,.3);padding:9px 16px}
.like.on{background:rgba(255,90,140,.35);color:#fff}
.spin{width:16px;height:16px;border:2px solid rgba(160,200,255,.3);border-top-color:var(--accent);border-radius:50%;
  display:inline-block;vertical-align:-3px;animation:sp 1s linear infinite;margin-right:8px}
@keyframes sp{to{transform:rotate(360deg)}}
.rating{padding:16px 20px}
.rating .bar{height:8px;border-radius:99px;background:rgba(127,178,255,.12);overflow:hidden;margin-top:6px}
.rating .bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#3d6bff,#a8c8ff);transition:width .6s ease}
.orb{position:fixed;z-index:0;border-radius:50%;filter:blur(2px);pointer-events:none;
  background:radial-gradient(circle at 35% 35%,rgba(120,160,255,.35),rgba(60,90,220,.08) 60%,transparent 70%)}
</style>
</head>
<body>
<canvas id="sky"></canvas>
<div class="orb" id="orb1" style="width:280px;height:280px;top:-80px;left:-70px;animation:drift 16s ease-in-out infinite alternate"></div>
<div class="orb" id="orb2" style="width:210px;height:210px;bottom:-60px;right:-50px;animation:drift 20s ease-in-out infinite alternate-reverse"></div>
<style>@keyframes drift{from{transform:translate3d(0,0,0)}to{transform:translate3d(40px,26px,0) scale(1.06)}}</style>

<div class="wrap">
  <h1>Гороскоп дня</h1>
  <p class="sub">звёзды меняются каждый день — страница обновляется сама</p>

  <div class="scene">
    <section class="card tilt bday" id="bdayCard">
      <h2>Ваш знак</h2>
      <div class="row">
        <input type="date" id="bday">
        <button class="btn" onclick="defineSign()">Определить знак</button>
        <span class="signname" id="signOut"></span>
      </div>
    </section>
  </div>

  <div class="scene">
    <section class="card tilt" id="gridCard">
      <div class="grid" id="grid"></div>
    </section>
  </div>

  <div class="scene">
    <section class="card tilt hcard" id="hCard">
      <div class="h2" id="hTitle">Гороскоп</div>
      <div class="tabs" id="tabs"></div>
      <div class="htext" id="hText">Выберите знак ✦</div>
      <div class="meta"><span id="srcBadge"></span><span id="hDate"></span></div>
      <div class="actions">
        <button class="like" id="likeBtn">♡ Нравится <span id="likeCnt"></span></button>
        <button class="ghost" onclick="translateToggle()" id="trBtn">Показать оригинал (EN)</button>
        <button class="ghost" onclick="load()">↻ Обновить</button>
      </div>
    </section>
  </div>

  <section class="card rating" id="rateCard">
    <div class="h2">Что вам больше всего понравилось</div>
    <div id="rateList" style="color:var(--dim);font-size:13.5px">Пока нет голосов — лайкайте гороскопы, которые зацепили ♡</div>
  </section>
</div>

<script>
'use strict';
/* ===== знаки зодиака ===== */
const SIGNS=[
 {id:'aries',ru:'Овен',sym:'♈',from:[3,21],to:[4,19]},
 {id:'taurus',ru:'Телец',sym:'♉',from:[4,20],to:[5,20]},
 {id:'gemini',ru:'Близнецы',sym:'♊',from:[5,21],to:[6,20]},
 {id:'cancer',ru:'Рак',sym:'♋',from:[6,21],to:[7,22]},
 {id:'leo',ru:'Лев',sym:'♌',from:[7,23],to:[8,22]},
 {id:'virgo',ru:'Дева',sym:'♍',from:[8,23],to:[9,22]},
 {id:'libra',ru:'Весы',sym:'♎',from:[9,23],to:[10,22]},
 {id:'scorpio',ru:'Скорпион',sym:'♏',from:[10,23],to:[11,21]},
 {id:'sagittarius',ru:'Стрелец',sym:'♐',from:[11,22],to:[12,21]},
 {id:'capricorn',ru:'Козерог',sym:'♑',from:[12,22],to:[1,19]},
 {id:'aquarius',ru:'Водолей',sym:'♒',from:[1,20],to:[2,18]},
 {id:'pisces',ru:'Рыбы',sym:'♓',from:[2,19],to:[3,20]}];
function signByDate(d){const m=d.getMonth()+1,dd=d.getDate();
 for(const s of SIGNS){const[a,ad]=s.from,[b,bd]=s.to;
  if(a<b?(m===a&&dd>=ad||m===b&&dd<=bd||m>a&&m<b):(m===a&&dd>=ad||m===b&&dd<=bd))return s}return SIGNS[9]}
const $=id=>document.getElementById(id);

/* ===== звёздное небо ===== */
const cv=$('sky'),cx=cv.getContext('2d');let stars=[],mx=0,my=0;
function resize(){cv.width=innerWidth;cv.height=innerHeight;stars=[];
 for(let i=0;i<Math.min(260,innerWidth/5);i++)stars.push({x:Math.random()*cv.width,y:Math.random()*cv.height,
 r:Math.random()*1.3+.3,p:Math.random()*Math.PI*2,s:.4+Math.random()*1.6,d:Math.random()*.5+.4})}
addEventListener('resize',resize);resize();
addEventListener('pointermove',e=>{mx=(e.clientX/innerWidth-.5);my=(e.clientY/innerHeight-.5)},{passive:true});
(function loop(t){requestAnimationFrame(loop);cx.clearRect(0,0,cv.width,cv.height);
 for(const st of stars){const a=.35+.65*Math.abs(Math.sin(t/1000*st.s+st.p));
  cx.globalAlpha=a;cx.fillStyle='#cfe0ff';cx.beginPath();
  cx.arc(st.x+mx*30*st.d,st.y+my*30*st.d,st.r,0,7);cx.fill()}})(0);

/* ===== 3D-наклон карточек ===== */
document.querySelectorAll('.scene').forEach(sc=>{const el=sc.firstElementChild;
 sc.addEventListener('pointermove',e=>{const r=sc.getBoundingClientRect(),
 x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5;
 el.style.transform=`rotateY(${x*7}deg) rotateX(${-y*7}deg)`});
 sc.addEventListener('pointerleave',()=>el.style.transform='')});

/* ===== сетка знаков ===== */
SIGNS.forEach(s=>{const b=document.createElement('button');b.className='sign';b.dataset.id=s.id;
 b.innerHTML=`<span class="sym">${s.sym}</span><span class="nm">${s.ru}</span>`;
 b.onclick=()=>select(s.id);$('grid').appendChild(b)});

/* ===== состояние ===== */
let sign=localStorage.getItem('hs_sign')||null,tab='TODAY',cur=null;
const TABS=[['TODAY','Сегодня'],['TOMORROW','Завтра'],['WEEKLY','Неделя'],['MONTHLY','Месяц']];
TABS.forEach(([k,n])=>{const b=document.createElement('button');b.className='tab';b.textContent=n;
 b.onclick=()=>{tab=k;load()};b.dataset.k=k;$('tabs').appendChild(b)});
const saved=localStorage.getItem('hs_bday');if(saved){$('bday').value=saved;defineSign(true)}else renderTabs();

function defineSign(silent){const v=$('bday').value;if(!v)return;
 localStorage.setItem('hs_bday',v);const s=signByDate(new Date(v+'T12:00'));
 select(s.id,true);$('signOut').textContent=`— ${s.ru}`;
 if(!silent)$('bdayCard').animate([{transform:'scale(1)'},{transform:'scale(1.03)'},{transform:'scale(1)'}],{duration:350})}

function select(id,silent){sign=id;localStorage.setItem('hs_sign',id);
 document.querySelectorAll('.sign').forEach(b=>b.classList.toggle('on',b.dataset.id===id));
 if(!silent)load()}

function renderTabs(){document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('on',b.dataset.k===tab))}

/* ===== офлайн-генератор (когда сеть недоступна) ===== */
const GEN={open:['День располагает к переменам — смелые шаги окупятся','Энергия сегодня на вашей стороне','Прогноз благоприятный, если не суетиться','День про ясность: расставьте приоритеты','Небо подталкивает к действию, но без спешки'],
 love:['в отношениях тепло и взаимопонимание, не бойтесь говорить о чувствах','человек рядом нуждается во внимании — подарите ему время','в личной жизни возможен приятный сюрприз','старая обида забудется, если первой протянуть руку','романтический настрой вернётся ближе к вечеру'],
 work:['на работе важна сосредоточенность: одно дело за раз','финансовый вопрос решится спокойнее, чем вы думаете','идеи руководства стоит услышать до конца — в них есть польза','деловая интуиция сегодня особенно точна','не берите на себя чужие задачи, своих хватит'],
 health:['организм просит режима: сон и вода решат больше, чем кофе','лёгкая прогулка снимет накопившееся напряжение','вечером устройте себе паузу от экранов','хорошо то, что вы делаете для себя регулярно','прислушайтесь к телу — оно подскажет, где перегруз']};
function hsh(a,b){let h=0;const s=a+b;for(let i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))>>>0;
 return h}
function genText(sig,tab,date){const k=hsh(sig+tab,date);const c=[0,1,2].map(i=>(k>>(4*i))&7);
 return `${GEN.open[c[0]%5]}: ${GEN.love[c[1]%5]}, ${GEN.work[(c[0]+c[2])%5]}. А ещё ${GEN.health[c[2]%5]}.`}

/* ===== загрузка гороскопа ===== */
const API='https://freehoroscopeapi.com/api/v1/get-horoscope/';
function apiPath(t){return t==='WEEKLY'||t==='MONTHLY'?API+(t==='WEEKLY'?'weekly':'monthly'):API+'daily?day='+t}
async function load(){if(!sign)return;renderTabs();$('hText').innerHTML='<span class="spin"></span>Смотрю на звёзды…';
 const s=SIGNS.find(x=>x.id===sign);
 $('hTitle').textContent=`${s.sym} ${s.ru} — гороскоп`;
 const date=new Date().toISOString().slice(0,10);
 try{const r=await fetch(apiPath(tab));if(!r.ok)throw 0;const j=await r.json();
  cur={text:j.data.horoscope,src:'live'};$('srcBadge').className='src live';
  $('srcBadge').textContent='✓ живой источник';$('hDate').textContent=j.data.date}
 catch(e){cur={text:genText(sign,tab,date),src:'gen'};$('srcBadge').className='src gen';
  $('srcBadge').textContent='офлайн-вариант';$('hDate').textContent=date}
 $('likeCnt').textContent=likes().cnt;updateLikeBtn();show();$('trBtn').textContent='Показать оригинал (EN)';trOn=false}

/* ===== перевод (MyMemory, без ключа) ===== */
let trText='',trOn=false;
function chunk(t){const parts=t.split(/(?<=[.!?])\s+/);const out=[];let c='';
 for(const p of parts){if((c+p).length>420){out.push(c);c=p}else c+=(c?' ':'')+p}if(c)out.push(c);return out.slice(0,5)}
async function translate(t){
 const res=await Promise.all(chunk(t).map(async p=>{
  const r=await fetch('https://api.mymemory.translated.net/get?q='+encodeURIComponent(p)+'&langpair=en|ru');
  const j=await r.json();return j.responseData?j.responseData.translatedText||p:p}));
 return res.join(' ')}
async function show(){const raw=cur.text;$('hText').textContent='⟳ перевод…';
 try{const ru=await translate(raw);trText=raw;cur.ru=ru;$('hText').textContent=ru;$('trBtn').textContent='Показать оригинал (EN)'}
 catch(e){$('hText').textContent=raw;$('trBtn').textContent='Перевод недоступен'}}
function translateToggle(){if(!cur)return;if(cur.ru==null)return show();trOn=!trOn;
 $('hText').textContent=trOn?cur.ru:cur.text;$('trBtn').textContent=trOn?'Показать оригинал (EN)':'Показать перевод (RU)'}

/* ===== голосование (хранится на устройстве) ===== */
const VKEY='hs_votes',V='hs_mine';
function votes(){return JSON.parse(localStorage.getItem(VKEY)||'{}')}
function likes(){const v=votes();const key=sign+'|'+tab;
 return {cnt:v[key]||0}}
function updateLikeBtn(){const mine=JSON.parse(localStorage.getItem(V)||'[]');
 const on=mine.includes(sign+'|'+tab);$('likeBtn').classList.toggle('on',on);
 $('likeBtn').firstChild.textContent=on?'❤ Нравится ':'♡ Нравится '}
$('likeBtn').onclick=()=>{const key=sign+'|'+tab;const mine=JSON.parse(localStorage.getItem(V)||'[]');
 const v=votes();const i=mine.indexOf(key);
 if(i>=0){mine.splice(i,1);v[key]=Math.max(0,(v[key]||0)-1)}else{mine.push(key);v[key]=(v[key]||0)+1}
 localStorage.setItem(V,JSON.stringify(mine));localStorage.setItem(VKEY,JSON.stringify(v));
 $('likeCnt').textContent=likes().cnt;updateLikeBtn();renderRating()};
function renderRating(){const v=votes();const items=Object.entries(v).filter(([,c])=>c>0)
 .sort((a,b)=>b[1]-a[1]).slice(0,4);
 if(!items.length)return;
 const max=items[0][1];$('rateList').innerHTML=items.map(([k,c])=>{
  const[id,t]=k.split('|');const s=SIGNS.find(x=>x.id===id);const n=(TABS.find(x=>x[0]===t)||['',''])[1];
  return `<div style="margin:8px 0"><span>${s?s.sym:''} ${s?s.ru:''} · ${n} — ❤ ${c}</span><div class="bar"><i style="width:${Math.round(c/max*100)}%"></i></div></div>`}).join('')}
renderRating();

/* автозагрузка сохранённого знака */
if(sign){document.querySelectorAll('.sign').forEach(b=>b.classList.toggle('on',b.dataset.id===sign));load()}
</script>
</body>
</html>
